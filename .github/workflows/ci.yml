name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma needs a syntactically valid URL to generate the client. Generation
  # never connects, so this placeholder is safe and keeps CI database-free.
  DATABASE_URL: "postgresql://ci:ci@localhost:26257/ci"

jobs:
  verify:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Backend types are generated from prisma/schema.prisma. Without this,
      # every subsequent step fails with type errors unrelated to the change.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
